<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <!--
    Temporary monochrome landscape for the hero (Phase 1B).
    One image serves both the framed photo and the atmospheric band.
    The sky is transparent; the hero supplies it per theme.
    Replace with a photograph by changing content.hero.image.src.
  -->
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="soft">
        <feFuncA type="linear" slope="0.22"/>
      </feComponentTransfer>
      <feComposite in="soft" in2="SourceGraphic" operator="in" result="clipped"/>
      <feBlend in="clipped" in2="SourceGraphic" mode="multiply"/>
    </filter>
    <filter id="mist" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a3a9ae"/>
      <stop offset="1" stop-color="#7d8489"/>
    </linearGradient>
    <linearGradient id="lit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b7278"/>
      <stop offset="1" stop-color="#454b51"/>
    </linearGradient>
  </defs>

  <g filter="url(#grain)">
    <!-- distant range -->
    <path fill="url(#far)" opacity="0.55" d="M0 640 L120 600 L240 622 L360 560 L480 592 L600 540 L720 584 L820 562 L900 600 L1000 578 L1200 620 L1400 590 L1600 612 L1600 1000 L0 1000 Z"/>

    <!-- main peak: lit face, shadow face, snow -->
    <path fill="url(#lit)" d="M560 1000 L760 640 L840 604 L920 470 L980 400 L1050 228 L1090 300 L1130 340 L1200 460 L1280 520 L1380 640 L1500 720 L1600 780 L1600 1000 Z"/>
    <path fill="#30353a" d="M1050 228 L1090 300 L1130 340 L1200 460 L1280 520 L1380 640 L1500 720 L1600 780 L1600 1000 L1120 1000 L1082 700 L1062 452 Z"/>
    <path fill="#eceeef" d="M1050 228 L1090 300 L1112 332 L1086 346 L1072 322 L1063 392 L1041 360 L1022 424 L1006 384 L980 400 Z"/>
    <path fill="#c9cdd0" d="M1090 300 L1130 340 L1152 404 L1121 382 L1110 452 L1094 372 Z"/>
    <path fill="#dfe2e4" d="M920 470 L980 400 L962 470 L944 452 L930 510 Z"/>

    <!-- left shoulder -->
    <path fill="#5c6369" d="M0 760 L140 682 L260 702 L380 622 L470 662 L560 722 L700 800 L760 1000 L0 1000 Z"/>
    <path fill="#d5d9db" opacity="0.8" d="M380 622 L470 662 L430 668 L410 700 L396 660 Z"/>

    <!-- foreground ridge -->
    <path fill="#1d2125" d="M0 880 L200 842 L420 872 L640 822 L860 872 L1080 842 L1300 882 L1600 852 L1600 1000 L0 1000 Z"/>
  </g>

  <!-- low cloud -->
  <g filter="url(#mist)" fill="#ffffff">
    <ellipse cx="640" cy="770" rx="380" ry="62" opacity="0.5"/>
    <ellipse cx="1320" cy="700" rx="300" ry="54" opacity="0.38"/>
  </g>
</svg>
